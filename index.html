if(key)$('bK').textContent='✅ AI aktif';
setTimeout(()=>{if(!sample&&!PROXY)$('bK').style.display='inline-block'},3000);
$('bK').onclick=()=>{const k=prompt(key?'AI sedang aktif. Tempel kunci baru untuk mengganti, atau ketik HAPUS untuk menghapus kunci dari perangkat ini.':'Tempel API key Anthropic untuk mengaktifkan soal buatan AI. Kunci disimpan di browser perangkat ini agar tidak perlu dimasukkan lagi. Gunakan hanya di perangkat pribadi.');if(!k)return;if(k.trim().toUpperCase()==='HAPUS'){key='';try{localStorage.removeItem('k3d_key')}catch(e){}$('bK').textContent='🔑 Aktifkan AI';return}key=k.trim();try{localStorage.setItem('k3d_key',key)}catch(e){}$('bK').textContent='✅ AI aktif'};
/* ---------- Panel ---------- */
const P=$('panel');
function head(){clearCards();P.textContent='';const c=el('div',null,'chips',P);S.forEach(s=>{const b=el('button',s.e+' '+s.n+' ('+Math.min(N,st[s.id].d)+'/'+N+')','chip'+(cur&&cur.id===s.id?' on':''),c);b.onclick=()=>open(s.id)})}
function home(){head();cur=null;el('h2','Selamat datang, calon manajer pendidikan! 👋',null,P).style.fontSize='17px';
el('p','Kamu bertugas sebagai staf administrasi baru di sebuah kantor kampus. Jelajahi kantor 3D di samping dan selesaikan 7 stasiun (2 tantangan per stasiun, total sekitar 15–20 menit). Soal dibuat otomatis oleh AI, jadi setiap kali bermain kasusnya berbeda.',null,P);
el('p','Mulai dengan mengetuk salah satu bola kuning di kantor 3D, atau pilih stasiun di atas. Tombol “Mode AR” menampilkan kantor di atas tampilan kamera ponselmu.','src',P);setTimeout(()=>{if(!cur)el('p','Status AI: '+(sample?'aktif (Claude)':key?'aktif (API key)':PROXY?'aktif (server)':'offline, memakai bank soal cadangan'),'src',P)},1500)}
function open(id){cur=S.find(s=>s.id===id);tgg.set(cur.x,1,cur.z);head();el('h2',cur.e+' '+cur.n,null,P).style.fontSize='17px';
el('span',cur.t==='pilih'?'Interaksi: pilih keputusan':'Interaksi: susun urutan','tag',P);el('p',cur.m,null,P);
const d=st[id].d;const b=el('button',d>=N?'Latihan bebas dengan AI (tanpa skor)':(d?'Lanjut tantangan '+(d+1)+'/'+N:'Mulai tantangan 1/'+N),'p',P);b.onclick=()=>next()}
async function gen(s){const free=st[s.id].d>=N,n=st[s.id].d+1;
const fmt=s.t==='pilih'?'{"skenario":"...","opsi":["..","..","..",".."],"benar":0-3,"penjelasan":".."}':'{"skenario":"...","langkah":["langkah 1 (urutan benar)","..","..",".."],"penjelasan":".."}';
const pr='Kamu pembuat soal untuk mata kuliah Manajemen Perkantoran, mahasiswa Manajemen Pendidikan. Topik: '+s.topic+'. Buat satu studi kasus BARU bernuansa sekolah/kampus (tingkat '+(free?'sulit':['mudah','sedang','sulit'][n-1])+'). Hindari kemiripan dengan: '+seen.slice(-4).join(' | ')+'. Panjang skenario maksimal 2 kalimat, opsi singkat, letak jawaban benar diacak. Balas HANYA JSON valid tanpa markdown dengan format: '+fmt;
if(sample||key||PROXY){try{const j=sample?await sample.json(pr,{cache:false}):key?await viaKey(pr):await viaProxy(pr);const ok=s.t==='pilih'?(Array.isArray(j.opsi)&&j.opsi.length==4&&Number.isInteger(j.benar)&&j.benar>=0&&j.benar<4):(Array.isArray(j.langkah)&&j.langkah.length==4);if(j&&j.skenario&&ok){j.ai=1;j.pr=pr;j.via=sample?'Claude':key?'API key':'server';return j}}catch(e){if(e&&e.code==='not_granted')sample=null}}
const a=FB[s.id],o=st[s.id];o.f=o.f||0;return vary(a[o.f++%a.length])}
async function next(){const s=cur;head();el('h2',s.e+' '+s.n,null,P).style.fontSize='17px';el('p','🤖 AI sedang menyusun kasus baru untukmu…','src',P);const q=await gen(s);if(cur!==s)return;seen.push(q.skenario);render(s,q)}
function render(s,q){head();el('h2',s.e+' '+s.n,null,P).style.fontSize='17px';const free=st[s.id].d>=N;
el('span',(free?'Latihan bebas':'Tantangan '+(st[s.id].d+1)+'/'+N),'tag',P);el('span',q.ai?' 🤖 dibuat AI ('+q.via+')':' 📚 bank soal cadangan (konteks & urutan diacak otomatis)','src',P);
el('p',q.skenario,null,P);
if(q.ai){const d=el('details',null,'src',P);el('summary','🔍 Lihat cara kerja AI',null,d);el('div','Prompt yang dikirim ke AI: '+q.pr,null,d);el('pre','Jawaban AI (JSON): '+JSON.stringify({skenario:q.skenario,opsi:q.opsi,langkah:q.langkah,benar:q.benar},null,1),null,d).style.whiteSpace='pre-wrap'}
el('p','Jawab lewat tombol di sini, atau ketuk langsung kartu 3D yang melayang di atas objek.','src',P);const fb=el('div',null,'fb',P);fb.style.display='none';let done=false;
const fin=(ok,msg)=>{if(done)return;done=true;if(!free){st[s.id].d++;if(ok){st[s.id].ok++;score++}upd()}fb.style.display='block';fb.textContent=(ok?'✅ Tepat! ':'❌ Belum tepat. ')+(msg||'')+' '+(q.penjelasan||'');
const nb=el('button',st[s.id].d>=N&&!free?'Selesai stasiun ✔':'Soal berikutnya →','p',fb);nb.style.display='block';nb.style.marginTop='8px';nb.onclick=()=>{if(S.every(x=>st[x.id].d>=N)&&!free&&!seenEnd){seenEnd=1;end()}else if(st[s.id].d>=N&&!free)open(s.id);else next()}};
if(s.t==='pilih'){const w=el('div',null,null,P);const hs=q.opsi.map((o,i)=>{const b=el('button',o,'opt',w);const h=()=>{if(done)return;[...w.children].forEach((x,j)=>{x.disabled=true;if(j===q.benar)x.classList.add('ok')});if(i!==q.benar)b.classList.add('no');cards.forEach((c,j)=>{c.material.color.set(j===q.benar?0x9fe6b0:j===i?0xff9c94:0xffffff);c.material.opacity=(j===q.benar||j===i)?1:.45;if(j===q.benar)c.scale.setScalar(1.2)});fin(i===q.benar)};b.onclick=h;return h});showCards(s,q.opsi,i=>hs[i]())}
else{const order=q.langkah.map((t,i)=>({t,i}));for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
el('p','Ketuk langkah sesuai urutan yang benar:','src',P);const w=el('div',null,null,P),ol=el('ol',null,null,P),pick=[];
const hs=order.map((o,n)=>{const b=el('button',o.t,'opt',w);const h=()=>{if(done||b.disabled)return;b.disabled=true;pick.push(o.i);el('li',o.t,null,ol);const c=cards[n];c.userData.tgt.set(s.x-2.55+(pick.length-1)*1.7,2.3,s.z);c.material.color.set(0xdbe6ff);if(pick.length===4){cards.forEach((cc,m)=>cc.material.color.set(pick.indexOf(order[m].i)===order[m].i?0x9fe6b0:0xff9c94));const ok=pick.every((v,k)=>v===k);fin(ok,ok?'':'Urutan benar: '+q.langkah.map((x,k)=>(k+1)+'. '+x).join('; ')+'.')}};b.onclick=h;return h});showCards(s,order.map(o=>o.t),i=>hs[i]());
const r=el('button','↺ Ulangi susunan',null,P);r.onclick=()=>{if(!done)render(s,q)}}}
let seenEnd=0;
function end(){head();cur=null;el('h2','🎉 Semua misi selesai!',null,P).style.fontSize='17px';const m=Math.max(1,Math.round((Date.now()-t0)/6e4));
el('p','Skor akhir: '+score+' dari '+S.length*N+' tantangan dalam ±'+m+' menit.',null,P);
el('p',score>=S.length*N*.8?'Luar biasa! Kamu siap menjadi manajer perkantoran pendidikan.':score>=S.length*N*.55?'Bagus! Ulangi stasiun yang masih lemah lewat latihan bebas bersama AI.':'Tetap semangat! Pelajari ringkasan materi di tiap stasiun, lalu coba latihan bebas dengan AI.',null,P);
el('p','Ketuk stasiun mana pun untuk latihan bebas dengan soal AI baru.','src',P)}
upd();home();
</script></body></html>
